# Image GHCR — linkedin-mcp (FastMCP/uvicorn, streamable-http), port 8000, UID 1000.
# Pas de navigateur local : scraping via CDP sur le Chromium partagé du homelab
# (LINKEDIN_CDP_URL → IP du Service chromium-cdp-pod.openclaw, ADR-017 linkedin_scraper).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedin-mcp
  namespace: linkedin-mcp
  labels:
    app.kubernetes.io/name: linkedin-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkedin-mcp
  template:
    metadata:
      labels:
        app: linkedin-mcp
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: tmp
          emptyDir: {}
        - name: session
          secret:
            secretName: linkedin-mcp-session
        - name: oauth-tokens
          secret:
            secretName: linkedin-mcp-oauth-tokens
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/vinzlac/linkedin-mcp:c5ac59084da22786c601a5349b67bb492a32ff48
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            # linkedin_scraper (rate_limit_guard.py, permalink_cache.py — ADR-016) écrit
            # sans option de config dans Path.home()/.cache/linkedin_scraper. Pas de
            # HOME réel inscriptible sous readOnlyRootFilesystem : on pointe HOME sur
            # /tmp (emptyDir, seul chemin inscriptible). Conséquence déjà documentée
            # dans le plan de déploiement : cooldown/cache non persistés entre restarts.
            - name: HOME
              value: "/tmp"
            # IP directe (pas le nom DNS du Service) : Chromium rejette en 500 toute
            # requête CDP dont le header Host n'est pas une IP littérale ou "localhost"
            # (protection anti DNS-rebinding intégrée, pas de flag pour la désactiver).
            # ClusterIP du Service chromium-cdp-pod.openclaw — stable tant que le
            # Service n'est pas supprimé/recréé. Voir post-mortem correspondant.
            - name: LINKEDIN_CDP_URL
              value: "http://10.43.79.244:9222"
            - name: LINKEDIN_SESSION_PATH
              value: "/secrets/session/linkedin_session.json"
            - name: TOKEN_STORAGE_PATH
              value: "/secrets/oauth-tokens"
          envFrom:
            - secretRef:
                name: linkedin-mcp-oauth-creds
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: session
              mountPath: /secrets/session
              readOnly: true
            - name: oauth-tokens
              mountPath: /secrets/oauth-tokens
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "500m"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

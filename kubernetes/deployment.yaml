# Image GHCR — linkedin-mcp (FastMCP/uvicorn, streamable-http), port 8000, UID 1000.
# Pas de navigateur local : scraping via CDP sur le Chromium partagé du homelab
# (LINKEDIN_CDP_URL → ClusterIP du Service chromium-cdp-host.openclaw, ADR-017).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedin-mcp
  namespace: linkedin-mcp
  labels:
    app.kubernetes.io/name: linkedin-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkedin-mcp
  template:
    metadata:
      labels:
        app: linkedin-mcp
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: tmp
          emptyDir: {}
        - name: session
          secret:
            secretName: linkedin-mcp-session
        - name: oauth-tokens
          secret:
            secretName: linkedin-mcp-oauth-tokens
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/vinzlac/linkedin-mcp:ea7260fc2918042a4c8297a5911365bd3f1618c0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            # linkedin_scraper (rate_limit_guard.py, permalink_cache.py — ADR-016) écrit
            # sans option de config dans Path.home()/.cache/linkedin_scraper. Pas de
            # HOME réel inscriptible sous readOnlyRootFilesystem : on pointe HOME sur
            # /tmp (emptyDir, seul chemin inscriptible). Conséquence déjà documentée
            # dans le plan de déploiement : cooldown/cache non persistés entre restarts.
            - name: HOME
              value: "/tmp"
            # IP directe (pas le nom DNS du Service) : Chromium rejette en 500 toute
            # requête CDP dont le header Host n'est pas une IP littérale ou "localhost"
            # (protection anti DNS-rebinding intégrée, pas de flag pour la désactiver).
            # Variante 10A (navigateur sur l'hôte) plutôt que 10B (navigateur en
            # pod). Deux raisons, constatées le 2026-09-04 : l'image du pod est
            # figée sur Chrome 124 (~2 ans de retard, signal d'automatisation à
            # lui seul) et tournait en headless, ce qui a valu au compte une
            # vérification de sécurité LinkedIn récurrente. L'hôte utilise le
            # snap chromium, à jour, et désormais lancé en mode fenêtré sous Xvfb
            # (k3s-homelab, playbook install-chromium-cdp-host.yml).
            #
            # ClusterIP et surtout PAS le nom DNS du Service : Chrome rejette
            # toute requête CDP dont l'en-tête Host n'est ni une IP ni localhost
            # (« Host header is specified and is not an IP address or localhost »,
            # HTTP 500). C'est la raison de fond de cette adresse en dur, stable
            # tant que le Service n'est pas supprimé/recréé.
            - name: LINKEDIN_CDP_URL
              value: "http://10.43.230.242:9222"
            - name: LINKEDIN_SESSION_PATH
              value: "/secrets/session/linkedin_session.json"
            - name: TOKEN_STORAGE_PATH
              value: "/secrets/oauth-tokens"
          envFrom:
            - secretRef:
                name: linkedin-mcp-oauth-creds
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: session
              mountPath: /secrets/session
              readOnly: true
            - name: oauth-tokens
              mountPath: /secrets/oauth-tokens
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "500m"
              # 1Gi -> 1.5Gi (2026-09-02) stopgap : fuite mémoire de fond persiste
              # malgré le fix browser-crash-recovery (427a35a) — 859Mi/1Gi (86%) 7h
              # après restart. Espace le cycle OOM le temps du vrai fix (recycle
              # périodique du singleton BrowserManager, pas seulement sur crash).
              memory: 1536Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

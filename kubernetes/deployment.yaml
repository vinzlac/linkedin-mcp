# Image GHCR — linkedin-mcp (FastMCP/uvicorn, streamable-http), port 8000, UID 1000.
# Pas de navigateur local : scraping via CDP sur le Chromium dédié de gpu-node
# (LINKEDIN_CDP_URL, ADR-005).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkedin-mcp
  namespace: linkedin-mcp
  labels:
    app.kubernetes.io/name: linkedin-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkedin-mcp
  template:
    metadata:
      labels:
        app: linkedin-mcp
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      volumes:
        - name: tmp
          emptyDir: {}
        - name: session
          secret:
            secretName: linkedin-mcp-session
        - name: oauth-tokens
          secret:
            secretName: linkedin-mcp-oauth-tokens
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: ghcr.io/vinzlac/linkedin-mcp:36f4dab8ba1d28b7a3d633e727e36842e2b9d85f
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            # linkedin_scraper (rate_limit_guard.py, permalink_cache.py — ADR-016) écrit
            # sans option de config dans Path.home()/.cache/linkedin_scraper. Pas de
            # HOME réel inscriptible sous readOnlyRootFilesystem : on pointe HOME sur
            # /tmp (emptyDir, seul chemin inscriptible). Conséquence déjà documentée
            # dans le plan de déploiement : cooldown/cache non persistés entre restarts.
            - name: HOME
              value: "/tmp"
            # Chromium DÉDIÉ à linkedin-mcp sur gpu-node (instance chromium-cdp-linkedin,
            # k3s-homelab ansible/vars/chromium-cdp-linkedin.yml) : son profil porte la
            # session LinkedIn et n'est partagé avec personne (ADR-005, incident
            # 2026-10-07). IP et non nom DNS : Chrome rejette un en-tête Host qui n'est
            # ni une IP ni localhost (HTTP 500).
            - name: LINKEDIN_CDP_URL
              value: "http://192.168.1.154:9242"
            - name: LINKEDIN_SESSION_PATH
              value: "/secrets/session/linkedin_session.json"
            - name: TOKEN_STORAGE_PATH
              value: "/secrets/oauth-tokens"
          envFrom:
            - secretRef:
                name: linkedin-mcp-oauth-creds
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: session
              mountPath: /secrets/session
              readOnly: true
            - name: oauth-tokens
              mountPath: /secrets/oauth-tokens
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "500m"
              # 1Gi -> 1.5Gi (2026-09-02) stopgap : fuite mémoire de fond persiste
              # malgré le fix browser-crash-recovery (427a35a) — 859Mi/1Gi (86%) 7h
              # après restart. Espace le cycle OOM le temps du vrai fix (recycle
              # périodique du singleton BrowserManager, pas seulement sur crash).
              memory: 1536Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20

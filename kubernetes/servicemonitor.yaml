# Prometheus scrape for linkedin-mcp's /metrics (port 8000, named "http").
# The homelab kube-prometheus-stack Prometheus has empty
# serviceMonitorSelector / serviceMonitorNamespaceSelector, so a ServiceMonitor
# anywhere is picked up automatically — no extra labels required.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: linkedin-mcp
  namespace: linkedin-mcp
  labels:
    app: linkedin-mcp
spec:
  namespaceSelector:
    matchNames: [linkedin-mcp]
  selector:
    matchLabels:
      # Matches the real Service's labels (service.yaml), not its pod
      # selector (`app: linkedin-mcp`, a different field).
      app.kubernetes.io/name: linkedin-mcp
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
